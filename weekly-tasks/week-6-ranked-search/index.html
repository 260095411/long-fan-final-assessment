<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Week 6 — Ranking a search result</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 860px; margin: 50px auto; padding: 0 20px; }
  h1 { font-size: 26px; }
  .controls { display: flex; gap: 22px; flex-wrap: wrap; margin: 18px 0 26px; }
  .control { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  input[type=range] { width: 160px; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .item { border: 1px solid #ddd; border-radius: 8px; padding: 12px 14px; display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: start; }
  .rank { font-family: ui-monospace, monospace; color: #999; font-size: 18px; }
  .title { font-weight: 600; margin: 0 0 4px; font-size: 15px; }
  .meta { color: #666; font-size: 12.5px; }
  .score { font-family: ui-monospace, monospace; font-size: 12px; text-align: right; color: #444; }
  .note { color: #666; font-size: 13px; }
  h2 { font-size: 18px; margin-top: 34px; }
</style>
</head>
<body>
  <h1>Week 6 — Ranking a search result</h1>
  <p class="note">The Week 6 exercise: build a small result list, then choose what "relevance" means by changing the weights. The ranking is not neutral; it is a rule with numbers in it.</p>

  <div class="controls">
    <label class="control">Recency weight
      <input id="w-recency" type="range" min="0" max="5" value="2" step="0.5" />
      <span id="v-recency" class="meta">2</span>
    </label>
    <label class="control">Engagement weight
      <input id="w-engagement" type="range" min="0" max="5" value="1" step="0.5" />
      <span id="v-engagement" class="meta">1</span>
    </label>
    <label class="control">Source weight
      <input id="w-source" type="range" min="0" max="5" value="1" step="0.5" />
      <span id="v-source" class="meta">1</span>
    </label>
  </div>

  <div class="list" id="list"></div>

  <h2>What changes when the weights change</h2>
  <p class="note" id="reflection"></p>

  <script src="data/news-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
